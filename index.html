<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e8f93">
<title>SuperTaha École des Îles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&display=swap">
<style>
/* Layout: a one-screen game. Map = horizontal archipelago you scroll through; Play = stage (platforms over the lagoon) beside the question card in landscape, stacked in portrait. Single committed daylight look. */
:root{
  --sky-1:#7fd3f7; --sky-2:#d9f3ff;
  --lagoon:#0e8f93; --lagoon-deep:#0a5e6e; --foam:#c8f1ee;
  --sand:#f7dc9c; --sand-deep:#d9a956; --palm:#3a9447; --palm-deep:#26703a;
  --coral:#ef6b55; --gold:#ffc93c; --gold-deep:#cf8d12;
  --ink:#1c2a39; --ink-soft:#4b5d70; --paper:#fffaf0; --card:#ffffff; --line:#e9dcc0;
  --good:#23945a; --good-bg:#dcf6e6; --bad:#cf4a3a; --bad-bg:#ffe3dd; --hint-bg:#fff2cc;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Andika","Trebuchet MS",system-ui,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.35;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;padding-inline:max(12px,env(safe-area-inset-left)) max(12px,env(safe-area-inset-right))}

/* Top bar */
.bar{display:flex;align-items:center;gap:10px;padding-block:8px;flex-wrap:nowrap}
.who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.who img{width:46px;height:46px;border-radius:14px;border:3px solid var(--card);box-shadow:0 3px 0 var(--line);object-fit:cover;flex:none}
.who h1{font-family:var(--f-display);font-weight:400;font-size:1.45rem;line-height:1;margin:0;letter-spacing:.01em;white-space:nowrap}
.who h1 span{color:var(--lagoon)}
.who small{display:block;color:var(--ink-soft);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who div{min-width:0;overflow:hidden}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-family:var(--f-display);font-size:1.15rem;font-variant-numeric:tabular-nums;flex:none}
.coin-i{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0 0 18%,var(--gold) 19% 62%,var(--gold-deep) 63%);box-shadow:inset 0 -2px 0 #0002;flex:none;position:relative}
.coin-i::after{content:"";position:absolute;inset:6px 9px;border-radius:3px;background:#fff7c8aa}
.star-i{width:24px;height:24px;flex:none;color:var(--gold)}
.icon-btn{border:2px solid var(--line);background:var(--card);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;font-size:1.15rem;flex:none}
.icon-btn[aria-pressed="false"]{opacity:.45}
.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.18)}}

main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}

/* ---------- MAP ---------- */
.map-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:2px 10px}
.map-head p{margin:0;font-size:1.05rem;max-width:46ch}
.map-head p b{font-family:var(--f-display);font-weight:400;font-size:1.2rem}
.go{border:0;border-radius:16px;background:var(--coral);color:#fff;font-family:var(--f-display);font-size:1.2rem;padding:12px 20px;box-shadow:0 5px 0 #b84836;letter-spacing:.02em}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #b84836}
.go.alt{background:var(--card);color:var(--lagoon-deep);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.sea{flex:1;min-height:0;border-radius:24px;background:
  radial-gradient(ellipse 60px 8px at 20% 30%,#ffffff30 60%,transparent 62%),
  radial-gradient(ellipse 80px 9px at 70% 75%,#ffffff26 60%,transparent 62%),
  linear-gradient(180deg,#22a8ab,var(--lagoon) 55%,var(--lagoon-deep));
  overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;position:relative}
.sea-row{display:flex;gap:18px;height:100%;padding:16px;width:max-content;align-items:stretch}
.isle{position:relative;width:min(300px,78vw);display:flex;flex-direction:column;scroll-snap-align:center;flex:none}
.isle-title{font-family:var(--f-display);color:#fff;font-size:1.3rem;text-shadow:0 2px 0 #0004;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.isle-title small{font-family:var(--f-body);font-size:.8rem;background:#ffffff2a;padding:2px 8px;border-radius:99px;text-shadow:none;white-space:nowrap}
.isle-land{position:relative;flex:1;min-height:170px}
.isle-land svg.blob{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;border:4px solid #fff;background:var(--lagoon);color:#fff;font-family:var(--f-display);font-size:1.35rem;display:grid;place-items:center;box-shadow:0 4px 0 #0003;padding:0}
.node .cat{position:absolute;top:-12px;right:-12px;width:28px;height:28px;border-radius:50%;background:#fff;font-size:.95rem;display:grid;place-items:center;box-shadow:0 2px 0 #0002}
.node .st{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);display:flex;gap:1px;background:#fff;border-radius:99px;padding:1px 5px;box-shadow:0 2px 0 #0002}
.node .st svg{width:13px;height:13px}
.node.done{background:var(--palm)}
.node.boss{background:var(--coral);width:66px;height:66px}
.node.current{animation:pulse 1.4s infinite}
.node:disabled{background:#9fb3b8;cursor:not-allowed}
.node:disabled .cat{filter:grayscale(1)}
@keyframes pulse{50%{box-shadow:0 4px 0 #0003,0 0 0 9px #ffffff66}}
.isle-hero{position:absolute;height:84px;transform:translate(-115%,-78%);pointer-events:none;filter:drop-shadow(0 4px 0 #0003);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{translate:0 -4px}}
.isle-chest{position:absolute;left:6px;top:4px;border:0;background:transparent;padding:0;width:62px}
.isle-chest svg{width:100%;height:auto;display:block}
.isle.locked .isle-land{filter:saturate(.25) brightness(.95)}
.lock-note{position:absolute;inset:auto 10px 10px;background:#1c2a39cc;color:#fff;border-radius:12px;padding:6px 10px;font-size:.85rem;text-align:center}
.treasures{display:flex;gap:8px;align-items:center;padding-block:10px 4px;flex-wrap:wrap;font-size:.9rem;color:var(--ink-soft)}
.treasures .t{display:flex;align-items:center;gap:6px;background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:4px 10px;color:var(--ink)}
.treasures .t.empty{opacity:.45}

/* ---------- PLAY ---------- */
.play{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px;padding-bottom:10px}
.stage{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(180deg,var(--sky-1),var(--sky-2) 70%);min-height:0}
.sun{position:absolute;right:9%;top:8%;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle,#fff6c4 0 35%,#ffd85a 60%,#ffd85a00 72%)}
.far{position:absolute;left:0;right:0;bottom:21%;height:26%;background-repeat:repeat-x;background-size:auto 100%;background-position:0 100%;transition:background-position .9s ease}
.water{position:absolute;left:0;right:0;bottom:0;height:23%;background:
  radial-gradient(ellipse 24px 5px at 25% 30%,#ffffff55 55%,transparent 60%),
  radial-gradient(ellipse 30px 5px at 75% 65%,#ffffff44 55%,transparent 60%),
  linear-gradient(180deg,#27b3b1,var(--lagoon) 50%,var(--lagoon-deep));background-size:120px 40px,150px 50px,100% 100%;animation:waves 6s linear infinite}
@keyframes waves{to{background-position:120px 0,-150px 0,0 0}}
.track{position:absolute;inset:0;transition:transform .9s cubic-bezier(.45,.05,.35,1)}
.plat{position:absolute;bottom:17%;width:var(--pw);height:calc(var(--pw)*.42);transform:translateX(-50%)}
.plat::before{content:"";position:absolute;inset:16% 0 0;border-radius:45% 45% 50% 50%/30% 30% 70% 70%;background:linear-gradient(180deg,var(--sand),var(--sand-deep));box-shadow:inset 0 -6px 0 #0000001a}
.plat::after{content:"";position:absolute;left:6%;right:6%;top:6%;height:24%;border-radius:999px;background:linear-gradient(180deg,#6cc05a,var(--palm));box-shadow:0 3px 0 var(--palm-deep)}
.plat .tree{position:absolute;bottom:80%;width:46%;left:var(--tx,60%)}
.coin{position:absolute;width:30px;height:30px;transform:translate(-50%,0);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0 0 16%,var(--gold) 17% 62%,var(--gold-deep) 63%);box-shadow:0 0 0 2px #fff8, inset 0 -3px 0 #0002;animation:spin 1.6s ease-in-out infinite}
.coin.got{visibility:hidden}
@keyframes spin{50%{transform:translate(-50%,-6px) scaleX(.55)}}
.chest-wrap{position:absolute;transform:translateX(-50%);width:calc(var(--pw)*.6)}
.chest-wrap svg{width:100%;display:block}
.lid{transform-box:view-box;transform-origin:6px 26px;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.open .lid{transform:translateY(-7px) rotate(-16deg)}
.glow{opacity:0;transition:opacity .5s .2s}
.open .glow{opacity:1}
.hero{position:absolute;bottom:calc(17% + var(--pw)*.33);transform:translateX(-50%);transform-origin:50% 100%;filter:drop-shadow(0 5px 0 #00000026);pointer-events:none}
.progress{position:absolute;left:12px;right:12px;top:10px;display:flex;gap:6px;align-items:center}
.progress i{flex:1;height:10px;border-radius:99px;background:#ffffff8c;border:2px solid #ffffffcc}
.progress i.on{background:var(--gold);border-color:#fff}
.lvl-tag{position:absolute;left:12px;top:30px;font-family:var(--f-display);color:#fff;text-shadow:0 2px 0 #0004;font-size:1.05rem}
.quit{position:absolute;right:10px;top:28px;border:0;background:#ffffffcc;border-radius:12px;padding:6px 10px;font-weight:700;font-size:.9rem}
.bubble{position:absolute;padding:6px 12px;border-radius:14px;background:#fff;font-family:var(--f-display);font-size:1.05rem;box-shadow:0 3px 0 #0002;transform:translate(-50%,-100%);white-space:nowrap;animation:pop .25s}
@keyframes pop{from{transform:translate(-50%,-80%) scale(.6);opacity:0}}

.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto}
.q-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.88rem;background:var(--foam);color:var(--lagoon-deep)}
.chip.prob{background:#ffe5c7;color:#8a4b0d}
.chip.logi{background:#eadff9;color:#5b3a8c}
.listen{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.9rem;display:flex;gap:6px;align-items:center}
.q-text{font-size:clamp(1.15rem,2.6vw,1.45rem);line-height:1.35;margin:0;text-wrap:balance}
.q-big{font-family:var(--f-display);font-weight:400;font-size:clamp(2.2rem,6vw,3.2rem);letter-spacing:.03em;margin:0;line-height:1.1;font-variant-numeric:tabular-nums}
.q-vis{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:1.7rem;line-height:1.2;align-items:center}
.q-vis .grp{display:flex;gap:2px}
.q-vis .op{font-family:var(--f-display);font-size:1.6rem;color:var(--ink-soft)}
.q-vis.seq{font-family:var(--f-display);font-size:clamp(1.6rem,4.5vw,2.2rem);gap:6px 10px}
.q-vis.seq .hole{display:inline-grid;place-items:center;min-width:1.7em;border-radius:12px;border:3px dashed var(--coral);color:var(--coral)}
.eqs{display:grid;gap:4px;font-family:var(--f-display);font-size:1.6rem}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:auto}
.ans{border:3px solid var(--line);background:var(--paper);border-radius:16px;min-height:62px;font-family:var(--f-display);font-size:1.7rem;box-shadow:0 4px 0 var(--line);padding:6px;font-variant-numeric:tabular-nums}
.ans:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.ans.ok{background:var(--good-bg);border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.ans.no{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad);animation:shake .35s}
.ans:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{border-radius:14px;padding:10px 12px;font-weight:700}
.fb.good{background:var(--good-bg);color:#155f39}
.fb.try{background:var(--hint-bg);color:#7a5408}
.fb.explain{background:#e7f3fb;color:#18435f;font-weight:400}
.fb.explain b{font-weight:700}
.fb .go{margin-top:8px;font-size:1.05rem;padding:9px 16px}

/* ---------- OVERLAY ---------- */
.ov{position:fixed;inset:0;background:#0e2a35b3;display:grid;place-items:center;padding:16px;z-index:20}
.card{background:var(--paper);border-radius:26px;padding:18px 20px;width:min(560px,100%);max-height:100%;overflow:auto;text-align:center;border:3px solid #fff;box-shadow:0 10px 0 #0003}
.card h2{font-family:var(--f-display);font-weight:400;font-size:1.9rem;margin:4px 0;color:var(--lagoon-deep)}
.card p{margin:6px 0}
.end-scene{display:flex;align-items:flex-end;justify-content:center;gap:14px;height:150px}
.end-scene img{height:140px}
.end-scene .big-chest{width:120px}
.stars{display:flex;justify-content:center;gap:8px;margin:6px 0}
.stars svg{width:44px;height:44px;transform:scale(0);animation:starIn .45s forwards}
.stars svg:nth-child(2){animation-delay:.25s}.stars svg:nth-child(3){animation-delay:.5s}
@keyframes starIn{70%{transform:scale(1.25)}to{transform:scale(1)}}
.reward{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:1.4rem;background:#fff;border:2px solid var(--line);border-radius:99px;padding:4px 14px}
.treasure-won{margin:10px auto 0;background:#fff4d6;border:2px solid var(--gold);border-radius:16px;padding:8px 12px;max-width:380px}
.treasure-won .e{font-size:2.4rem}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

/* ---------- PARENTS ---------- */
.parents{overflow-y:auto;padding-bottom:16px}
.parents h2{font-family:var(--f-display);font-weight:400;font-size:1.6rem;margin:4px 0 8px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.pcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px}
.pcard h3{margin:0 0 8px;font-size:1.05rem}
.meter{height:12px;border-radius:99px;background:#efe6d2;overflow:hidden;margin:4px 0 2px}
.meter i{display:block;height:100%;background:var(--lagoon);border-radius:99px}
.stat-row{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-soft);font-size:.9rem}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.toggle input{width:22px;height:22px;accent-color:var(--lagoon)}
.danger{border:2px solid var(--bad);color:var(--bad);background:#fff;border-radius:12px;padding:8px 14px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-weight:700;z-index:30;pointer-events:none;animation:pop .25s}
.fly{position:fixed;z-index:40;pointer-events:none;width:28px;height:28px}

/* Portrait / narrow: stack stage above the question */
@media (max-aspect-ratio: 1/1){
  .play{grid-template-columns:1fr;grid-template-rows:minmax(170px,38%) minmax(0,1fr)}
}
/* Short landscape phones */
@media (max-height:480px) and (min-aspect-ratio: 1/1){
  body{font-size:15px}
  .bar{padding-block:4px}
  .who img{width:36px;height:36px}
  .who h1{font-size:1.2rem}
  .who small{display:none}
  .pill{font-size:1rem;padding:3px 10px 3px 4px}
  .icon-btn{width:36px;height:36px}
  .panel{padding:10px 12px;gap:7px}
  .ans{min-height:48px;font-size:1.4rem}
  .q-big{font-size:2rem}
  .q-vis{font-size:1.35rem}
  .map-head{padding-block:0 6px}
  .map-head p{font-size:.95rem}
  .go{font-size:1rem;padding:9px 14px}
  .isle-land{min-height:120px}
  .node{width:46px;height:46px;font-size:1.1rem}
  .node.boss{width:52px;height:52px}
  .isle-hero{height:64px}
  .treasures{display:none}
  .end-scene{height:110px}.end-scene img{height:104px}.end-scene .big-chest{width:90px}
}
@media (max-width:520px){
  .who small{display:none}
  .who h1{display:none}
  .pill{font-size:1rem}
  .icon-btn{width:38px;height:38px}
  .bar{gap:6px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app">
  <header class="bar">
    <div class="who">
      <img id="portrait" alt="Taha" src="">
      <div><h1>Super<span>Taha</span></h1><small>L'école des îles</small></div>
    </div>
    <div class="pill" title="Pièces"><span class="coin-i" aria-hidden="true"></span><span id="coins">0</span></div>
    <div class="pill" title="Étoiles"><svg class="star-i" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" stroke="#cf8d12" stroke-width="1.4" stroke-linejoin="round" d="M12 2.6l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg><span id="stars">0</span></div>
    <button class="icon-btn" id="btn-sound" aria-pressed="true" title="Sons" aria-label="Sons">🔔</button>
    <button class="icon-btn" id="btn-parents" title="Espace parents" aria-label="Espace parents">👪</button>
  </header>
  <main>
    <section class="screen" id="scr-map">
      <div class="map-head">
        <p id="map-msg"></p>
        <button class="go" id="btn-continue">Jouer</button>
      </div>
      <div class="sea" id="sea"><div class="sea-row" id="sea-row"></div></div>
      <div class="treasures" id="treasures"></div>
    </section>

    <section class="screen" id="scr-play" hidden>
      <div class="play">
        <div class="stage" id="stage">
          <div class="sun"></div>
          <div class="far" id="far"></div>
          <div class="water"></div>
          <div class="track" id="track"></div>
          <img class="hero" id="hero" alt="" src="">
          <div class="progress" id="progress"></div>
          <div class="lvl-tag" id="lvl-tag"></div>
          <button class="quit" id="btn-quit">Carte</button>
        </div>
        <div class="panel" id="panel" aria-live="polite">
          <div class="q-top">
            <span class="chip" id="q-chip"></span>
            <button class="listen" id="btn-listen" aria-label="Écouter la question">🔊 Écouter</button>
          </div>
          <div id="q-body"></div>
          <div id="q-fb"></div>
          <div class="answers" id="answers"></div>
        </div>
      </div>
    </section>

    <section class="screen parents" id="scr-parents" hidden>
      <div class="map-head"><h2>Espace parents</h2><button class="go alt" id="btn-back">Retour à la carte</button></div>
      <div class="pgrid" id="pgrid"></div>
    </section>
  </main>
</div>
<div class="ov" id="ov" hidden><div class="card" id="ov-card"></div></div>

<script>

let AC=null;
function tone(f,t0,dur,type='square',vol=.06){
  if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
    const t=AC.currentTime+t0;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}
}

function speak(text){

    const v=speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}
}

/* ================= QUESTION GENERATORS ================= */
function numChoices(ans,min=0){
  const s=new Set([ans]);
  let c=[ans+1,ans-1,ans+2,ans-2,ans+10,ans-10,ans+3,ans-3,ans+5,ans+4];
  if(ans>=12&&ans<100&&ans%10!==Math.floor(ans/10)){c.unshift((ans%10)*10+Math.floor(ans/10))}
  c=c.filter(x=>x>=min&&x!==ans);
  const near=shuffle(c.slice(0,6)),rest=shuffle(c.slice(6));
  for(const x of [...near,...rest]){if(s.size>=4)break;s.add(x)}
  return [...s].sort((a,b)=>a-b).map(String);
}
const groupEmoji=(e,n)=>{let h='<span class="grp">';for(let i=0;i<n;i++){h+=e;if(i%5===4&&i<n-1)h+='</span><span class="grp">'}return h+'</span>'};
function explainAdd(a,b){
  const s=a+b;
  if(b<10&&a>=5&&(a%10)+b>10){const c=10-a%10;return `<b>${a} + ${b} = ${s}</b>. Astuce : ${a} + ${c} = ${a+c}, puis ${a+c} + ${b-c} = ${s}.`}
  if(b>=10&&a>=10){const t=b-b%10;return `<b>${a} + ${b} = ${s}</b>. Ajoute d'abord les dizaines : ${a} + ${t} = ${a+t}, puis les unités : ${a+t} + ${b%10} = ${s}.`}
  return `<b>${a} + ${b} = ${s}</b>. Compte à partir de ${Math.max(a,b)} et avance de ${Math.min(a,b)}.`;
}
function explainSub(a,b){
  const r=a-b;
  if(b<10&&a>10&&a%10<b){return `<b>${a} − ${b} = ${r}</b>. Astuce : ${a} − ${a%10} = ${a-a%10}, puis ${a-a%10} − ${b-a%10} = ${r}.`}
  return `<b>${a} − ${b} = ${r}</b>. Vérifie : ${r} + ${b} = ${a}.`;
}
function explainMul(a,b){
  const rep=a<=5?Array(a).fill(b).join(' + '):null;
  return `<b>${a} × ${b} = ${a*b}</b>. `+(rep?`C'est ${b} répété ${a} fois : ${rep}.`:`Récite la table de ${b} jusqu'à ${a} × ${b}.`);
}
function Q(cat,o){return Object.assign({cat,vis:'',big:'',text:''},o)}

function genCalc(d){
  const add=(a,b,vis)=>Q('calc',{big:`${a} + ${b} = ?`,say:`Combien font ${a} plus ${b} ?`,answer:String(a+b),choices:numChoices(a+b),explain:explainAdd(a,b),vis});
  const sub=(a,b,vis)=>Q('calc',{big:`${a} − ${b} = ?`,say:`Combien font ${a} moins ${b} ?`,answer:String(a-b),choices:numChoices(a-b),explain:explainSub(a,b),vis});
  const mul=(a,b)=>Q('calc',{big:`${a} × ${b} = ?`,say:`Combien font ${a} fois ${b} ?`,answer:String(a*b),choices:numChoices(a*b),explain:explainMul(a,b)});
  const div=(p,b)=>Q('calc',{big:`${p} ÷ ${b} = ?`,say:`Combien font ${p} divisé par ${b} ?`,answer:String(p/b),choices:numChoices(p/b,1),explain:`<b>${p} ÷ ${b} = ${p/b}</b>, car ${b} × ${p/b} = ${p}.`});
  const miss=(a,b)=>Q('calc',{big:`${a} + ? = ${a+b}`,say:`${a} plus combien font ${a+b} ?`,answer:String(b),choices:numChoices(b),explain:`Il manque <b>${b}</b> : ${a} + ${b} = ${a+b}. On peut calculer ${a+b} − ${a}.`});
  const half=n=>Q('calc',{text:'Quelle est la moitié de :',big:`${n}`,say:`Quelle est la moitié de ${n} ?`,answer:String(n/2),choices:numChoices(n/2,1),explain:`La moitié de ${n} est <b>${n/2}</b>, car ${n/2} + ${n/2} = ${n}.`});
  const dbl=n=>Q('calc',{text:'Quel est le double de :',big:`${n}`,say:`Quel est le double de ${n} ?`,answer:String(2*n),choices:numChoices(2*n),explain:`Le double de ${n}, c'est ${n} + ${n} = <b>${2*n}</b>.`});
  const fruit=pick(['🍊','🍎','⭐','🐚']);
  switch(d){
    case 1:{const a=R(1,5),b=R(1,4);return add(a,b,`<div class="q-vis">${groupEmoji(fruit,a)}<span class="op">+</span>${groupEmoji(fruit,b)}</div>`)}
    case 2:{if(Math.random()<.5){const a=R(2,8),b=R(1,10-a);return add(a,b,`<div class="q-vis">${groupEmoji(fruit,a)}<span class="op">+</span>${groupEmoji(fruit,b)}</div>`)}
      const a=R(3,10),b=R(1,a-1);return sub(a,b,`<div class="q-vis">${groupEmoji(fruit,a)}<span class="op">− ${b}</span></div>`)}
    case 3:{const t=R(0,2);if(t===0){const a=R(6,12),b=R(2,20-a>8?8:20-a);return add(a,b)}
      if(t===1){const a=R(11,19),b=R(1,a-10);return sub(a,b)} return dbl(R(2,6))}
    case 4:{const t=R(0,3);if(t===0){const a=R(1,9);return Q('calc',{big:`${a} + ? = 10`,say:`${a} plus combien font 10 ?`,answer:String(10-a),choices:numChoices(10-a),explain:`<b>${a} + ${10-a} = 10</b>. Ce sont des amis de 10.`})}
      if(t===1){const a=R(5,10);return add(a,a)} if(t===2){const a=R(2,8)*10+R(0,4),b=R(1,5);return add(a,b)}
      const a=R(11,18),b=R(Math.max(2,a-9),9);return sub(a,b)}
    case 5:{const t=R(0,3);if(t===0){const a=R(1,5)*10,b=R(1,4)*10;return add(a,b)} if(t===1){const a=R(4,9)*10,b=R(1,a/10-1)*10;return sub(a,b)}
      if(t===2){const a=R(1,7)*10+R(5,9),b=R(10-a%10,9);return add(a,b)} const a=R(4,12),b=R(3,9);return miss(a,b)}
    case 6:{if(Math.random()<.5){const a=R(12,59),b=R(11,Math.min(40,99-a));return add(a,b)}
      const a=R(35,98),bu=R(0,a%10),b=R(1,Math.floor(a/10)-1)*10+bu;return sub(a,b)}
    case 7:{const t=R(0,3);if(t<=1)return mul(R(2,10),pick([2,5,10]));if(t===2)return dbl(R(11,25));
      const a=R(31,90),b=R(11,a-15);return sub(a,b)}
    case 8:{const t=R(0,3);if(t<=1)return mul(R(2,10),pick([2,3,4,5]));if(t===2)return half(2*R(6,25));const a=R(15,40),b=R(5,25);return miss(a,b)}
    case 9:{if(Math.random()<.65)return mul(R(2,10),R(2,9));const a=R(41,98),b=R(12,a-10);return sub(a,b)}
    default:{const t=R(0,3);if(t===0){const b=R(2,9),r=R(2,10);return div(b*r,b)}
      if(t===1){const a=R(11,30),b=R(5,20),c=R(3,15);return Q('calc',{big:`${a} + ${b} + ${c} = ?`,say:`Combien font ${a} plus ${b} plus ${c} ?`,answer:String(a+b+c),choices:numChoices(a+b+c),explain:`<b>${a} + ${b} = ${a+b}</b>, puis ${a+b} + ${c} = <b>${a+b+c}</b>.`})}
      if(t===2){const b=R(2,9),r=R(2,10);return Q('calc',{big:`? × ${b} = ${b*r}`,say:`Combien fois ${b} font ${b*r} ?`,answer:String(r),choices:numChoices(r,1),explain:`<b>${r} × ${b} = ${b*r}</b>. Cherche dans la table de ${b}.`})}
      return mul(R(3,10),R(3,9))}
  }
}

const KIDS=[['Taha','il'],['Lina','elle'],['Adam','il'],['Sara','elle'],['Omar','il'],['Yasmine','elle'],['Ilyas','il'],['Nour','elle']];
const ITEMS=[{e:'🍊',s:'orange',p:'oranges'},{e:'🍎',s:'pomme',p:'pommes'},{e:'🖍️',s:'crayon',p:'crayons'},{e:'🔵',s:'bille',p:'billes'},{e:'🍪',s:'biscuit',p:'biscuits'},{e:'🐟',s:'poisson',p:'poissons'},{e:'🌰',s:'datte',p:'dattes'}];
const it=t=>t==='il'?'-t-il':'-t-elle';
function genProb(d){
  const [n,pr]=pick(KIDS),[n2,pr2]=pick(KIDS.filter(k=>k[0]!==n)),I=pick(ITEMS);
  const showVis=(k)=>d<=3&&k<=20?`<div class="q-vis">${groupEmoji(I.e,k)}</div>`:'';
  const mk=(text,ans,explain,vis='',choices)=>Q('prob',{text,say:text.replace(/<[^>]+>/g,''),answer:String(ans),choices:choices||numChoices(ans),explain,vis});
  const T={
    add(max){const a=R(2,Math.max(3,Math.floor(max*.6))),b=R(1,Math.max(1,max-a));return mk(`${n} a ${a} ${I.p}. ${pr2==='il'?'Son ami':'Son amie'} ${n2} lui en donne ${b}. Combien de ${I.p} ${n} a${it(pr)} maintenant ?`,a+b,`On ajoute : <b>${a} + ${b} = ${a+b}</b> ${I.p}.`,showVis(a))},
    sub(max){const a=R(4,max),b=R(1,a-1);return mk(`Il y a ${a} ${I.p} dans le panier. ${n} en prend ${b}. Combien de ${I.p} reste-t-il dans le panier ?`,a-b,`On enlève : <b>${a} − ${b} = ${a-b}</b> ${I.p}.`,showVis(a))},
    cmp(max){const a=R(2,max-3),b=R(a+1,max);return mk(`${n} a ${a} ${I.p}. ${n2} en a ${b}. Combien de ${I.p} ${n2} a${it(pr2)} de plus que ${n} ?`,b-a,`On cherche l'écart : <b>${b} − ${a} = ${b-a}</b>.`)},
    price(max){const a=R(2,Math.floor(max/2)),b=R(2,max-a);const x=pick([['un jus','un msemen'],['un cahier','une gomme'],['une glace','un jus'],['un pain','du fromage']]);return mk(`Au souk, ${x[0]} coûte ${a} dirhams et ${x[1]} coûte ${b} dirhams. Combien ${n} paie${it(pr)} pour les deux ?`,a+b,`On additionne les prix : <b>${a} + ${b} = ${a+b} dirhams</b>.`)},
    change(B){const p=R(Math.ceil(B*.2),B-1);return mk(`${n} a un billet de ${B} dirhams. ${pr==='il'?'Il':'Elle'} achète un livre à ${p} dirhams. Combien d'argent lui reste-t-il ?`,B-p,`On enlève le prix : <b>${B} − ${p} = ${B-p} dirhams</b>.`)},
    legs(big){const four=big&&Math.random()<.5;const k=four?R(2,6):R(2,big?9:5);const a=four?['dromadaires','4']:['poules','2'];return mk(`Dans la ferme de ${n}, il y a ${k} ${a[0]}. Chaque animal a ${a[1]} pattes. Combien de pattes en tout ?`,k*+a[1],`${k} fois ${a[1]} pattes : <b>${k} × ${a[1]} = ${k*a[1]}</b>.`)},
    groups(tables,maxg){const b=pick(tables),g=R(2,maxg);return mk(`${n} range des ${I.p} dans ${g} boîtes. Dans chaque boîte, il y a ${b} ${I.p}. Combien de ${I.p} en tout ?`,g*b,`${g} boîtes de ${b} : <b>${g} × ${b} = ${g*b}</b>.`)},
    share(){const k=R(2,5),r=R(2,8);return mk(`${n} partage ${k*r} ${I.p} entre ${k} enfants. Chacun reçoit autant. Combien de ${I.p} reçoit chaque enfant ?`,r,`<b>${k*r} ÷ ${k} = ${r}</b>, car ${k} × ${r} = ${k*r}.`,'',numChoices(r,1))},
    time(){const h=R(7,10),x=R(1,4),ans=h+x;const ch=[...new Set([ans,ans+1,ans-1,h])].slice(0,4);while(ch.length<4)ch.push(ans+2);return mk(`Le car part à ${h} heures. Le voyage dure ${x} heures. À quelle heure arrive-t-il ?`,ans+' h',`On avance de ${x} heures : <b>${h} + ${x} = ${ans} heures</b>.`,'',ch.sort((a,b)=>a-b).map(v=>v+' h'))},
    week(){const k=R(2,4);return mk(`Une semaine a 7 jours. Combien de jours y a-t-il dans ${k} semaines ?`,7*k,`<b>${k} × 7 = ${7*k}</b> jours.`)},
    two(){const p=R(3,9),m=pick([20,30,50]);return mk(`${n} a ${m} dirhams. ${pr==='il'?'Il':'Elle'} achète 2 jus à ${p} dirhams chacun. Combien lui reste-t-il ?`,m-2*p,`Les 2 jus coûtent ${p} + ${p} = ${2*p} dirhams. Puis <b>${m} − ${2*p} = ${m-2*p}</b>.`)}
  };
  switch(d){
    case 1:return pick([()=>T.add(9),()=>T.sub(8)])();
    case 2:return pick([()=>T.add(10),()=>T.sub(10),()=>T.cmp(10)])();
    case 3:return pick([()=>T.add(18),()=>T.sub(18),()=>T.cmp(15),()=>T.price(10)])();
    case 4:return pick([()=>T.add(20),()=>T.sub(20),()=>T.price(20),()=>T.legs(false),()=>T.change(10)])();
    case 5:return pick([()=>T.add(50),()=>T.sub(50),()=>T.price(40),()=>T.change(20),()=>T.time()])();
    case 6:return pick([()=>T.add(90),()=>T.cmp(90),()=>T.change(50),()=>T.groups([2,5],3),()=>T.time()])();
    case 7:return pick([()=>T.groups([2,5,10],6),()=>T.legs(true),()=>T.change(100),()=>T.cmp(99)])();
    case 8:return pick([()=>T.groups([2,3,4,5],6),()=>T.share(),()=>T.week(),()=>T.change(100)])();
    case 9:return pick([()=>T.groups([3,4,5,6],8),()=>T.share(),()=>T.two(),()=>T.legs(true)])();
    default:return pick([()=>T.groups([6,7,8,9],9),()=>T.share(),()=>T.two(),()=>T.week()])();
  }
}

const SYMS=['🌴','🐪','⭐','🌙','🐚','☀️','🌸','🐢'];
const FAM=[{n:'des fruits',a:['🍎','🍊','🍌','🍇','🍐','🍓']},{n:'des animaux',a:['🐪','🐟','🐢','🦊','🐐','🐓']},{n:'des véhicules',a:['🚗','🚌','🚲','🚂','⛵','🚀']}];
function genLogi(d){
  const types={
    seq(){
      let st,arr,rule;
      const lin=(a,s,n=5)=>Array.from({length:n},(_,i)=>a+s*i);
      if(d<=2){const s=d===1?1:pick([1,2]);st=R(1,6);arr=lin(st,s);rule=`On ajoute ${s} à chaque fois`}
      else if(d<=4){const s=pick([2,5,10,-1,-2]);st=s<0?R(12,20):R(0,9)*(s===5?1:1);if(s===5)st=R(0,4)*5;if(s===10)st=R(1,9);arr=lin(st,s);rule=s>0?`On ajoute ${s} à chaque fois`:`On enlève ${-s} à chaque fois`}
      else if(d<=6){const s=pick([3,4,5,10,-3,-5]);st=s<0?R(30,50):R(1,20);arr=lin(st,s);rule=s>0?`On ajoute ${s} à chaque fois`:`On enlève ${-s} à chaque fois`}
      else if(d<=8){if(Math.random()<.4){st=R(1,3);arr=[st,st*2,st*4,st*8,st*16];rule='On double à chaque fois'}else{const s=pick([6,7,9,-10,20]);st=s<0?R(80,99):R(2,15);arr=lin(st,s);rule=s>0?`On ajoute ${s} à chaque fois`:`On enlève ${-s} à chaque fois`}}
      else{if(Math.random()<.5){st=R(1,5);arr=[st];for(let i=1;i<5;i++)arr.push(arr[i-1]+i);rule="On ajoute 1, puis 2, puis 3, puis 4 : l'écart grandit"}else{st=R(2,6);arr=[st,st*2,st*4,st*8,st*16];rule='On double à chaque fois'}}
      const hole=d>=7&&Math.random()<.5?R(1,3):4;
      const ans=arr[hole];
      const vis=`<div class="q-vis seq">${arr.map((v,i)=>i===hole?'<span class="hole">?</span>':v).join('<span class="op">,</span>')}</div>`;
      return Q('logi',{text:'Quel nombre manque dans la suite ?',vis,say:`Quel nombre manque dans la suite : ${arr.map((v,i)=>i===hole?'combien':v).join(', ')} ?`,answer:String(ans),choices:numChoices(ans),explain:`${rule}. Le nombre qui manque est <b>${ans}</b>.`});
    },
    pattern(){
      const [A,B,C]=shuffle(SYMS);
      const motifs=d<=2?[[A,B]]:d<=4?[[A,B,C],[A,A,B],[A,B,B]]:[[A,A,B,B],[A,B,C,C],[A,B,A,C]];
      const m=pick(motifs);const len=m.length*2+R(1,m.length-1);
      const seq=Array.from({length:len},(_,i)=>m[i%m.length]);const ans=m[len%m.length];
      const opts=shuffle([...new Set([A,B,C,shuffle(SYMS).find(s=>![A,B,C].includes(s))])]).slice(0,4);
      return Q('logi',{text:'Quel dessin vient ensuite ?',vis:`<div class="q-vis seq">${seq.join(' ')} <span class="hole">?</span></div>`,say:'Regarde le motif. Quel dessin vient ensuite ?',answer:ans,choices:opts,explain:`Le motif <b>${m.join(' ')}</b> se répète. Ensuite vient <b>${ans}</b>.`});
    },
    intrus(){
      if(d<=3){const [F,G]=shuffle(FAM);const three=shuffle(F.a).slice(0,3),odd=pick(G.a);const all=shuffle([...three,odd]);
        return Q('logi',{text:"Lequel n'est pas de la même famille ?",vis:`<div class="q-vis seq">${all.join(' ')}</div>`,say:"Lequel n'est pas de la même famille ?",answer:odd,choices:all,explain:`Les autres sont ${F.n}. <b>${odd}</b> fait partie ${G.n.replace('des','des')}.`})}
      let three,odd,why;
      if(d<=6){const max=d<=4?20:60;three=[];while(three.length<3){const x=2*R(1,max/2);if(!three.includes(x))three.push(x)}odd=2*R(1,max/2-1)+1;why=`Les autres sont des nombres pairs (ils finissent par 0, 2, 4, 6 ou 8). <b>${odd}</b> est impair.`}
      else{const k=pick([5,10]);three=[];while(three.length<3){const x=k*R(2,19);if(!three.includes(x)&&x<100)three.push(x)}do{odd=R(11,99)}while(odd%k===0);why=`Les autres sont dans la table de ${k}. <b>${odd}</b> n'y est pas.`}
      const all=shuffle([...three,odd]).map(String);
      return Q('logi',{text:"Quel nombre est l'intrus ?",vis:`<div class="q-vis seq">${all.join('<span class="op">·</span>')}</div>`,say:`Quel nombre est l'intrus : ${all.join(', ')} ?`,answer:String(odd),choices:all,explain:why});
    },
    balance(){
      const [X,Y]=shuffle(SYMS);
      if(d<=5){const v=R(2,d<=3?5:10);return Q('logi',{text:`Combien vaut ${X} ?`,vis:`<div class="eqs"><div>${X} + ${X} = ${2*v}</div></div>`,say:`Deux symboles pareils font ${2*v}. Combien vaut un symbole ?`,answer:String(v),choices:numChoices(v,1),explain:`${X} + ${X} = ${2*v}, donc <b>${X} = ${v}</b> car ${v} + ${v} = ${2*v}.`})}
      if(d<=7){const v=R(2,10);return Q('logi',{text:`Combien vaut ${X} ?`,vis:`<div class="eqs"><div>${X} + ${X} + ${X} = ${3*v}</div></div>`,say:`Trois symboles pareils font ${3*v}. Combien vaut un symbole ?`,answer:String(v),choices:numChoices(v,1),explain:`3 fois le même nombre font ${3*v}. <b>${X} = ${v}</b>, car ${v} + ${v} + ${v} = ${3*v}.`})}
      const x=R(2,9),y=R(1,12);return Q('logi',{text:`Combien vaut ${Y} ?`,vis:`<div class="eqs"><div>${X} + ${X} = ${2*x}</div><div>${X} + ${Y} = ${x+y}</div></div>`,say:'Regarde les deux lignes. Combien vaut le deuxième symbole ?',answer:String(y),choices:numChoices(y,0),explain:`D'abord ${X} = ${x} (car ${x} + ${x} = ${2*x}). Puis ${x} + ${Y} = ${x+y}, donc <b>${Y} = ${y}</b>.`});
    },
    riddle(){
      if(d<=4){const n=R(1,9),a=R(1,6);return Q('logi',{text:`Je pense à un nombre. Si j'ajoute ${a}, j'obtiens ${n+a}. Quel est mon nombre ?`,say:`Je pense à un nombre. Si j'ajoute ${a}, j'obtiens ${n+a}. Quel est mon nombre ?`,answer:String(n),choices:numChoices(n,0),explain:`On fait le chemin inverse : <b>${n+a} − ${a} = ${n}</b>.`})}
      if(d<=6){if(Math.random()<.5){const n=R(5,30),a=R(2,9);return Q('logi',{text:`Je pense à un nombre. Si j'enlève ${a}, j'obtiens ${n-a}. Quel est mon nombre ?`,say:`Je pense à un nombre. Si j'enlève ${a}, j'obtiens ${n-a}. Quel est mon nombre ?`,answer:String(n),choices:numChoices(n),explain:`Chemin inverse : <b>${n-a} + ${a} = ${n}</b>.`})}
        const t=R(1,9),u=R(0,9),n=10*t+u;return Q('logi',{text:`J'ai ${t} dizaine${t>1?'s':''} et ${u} unité${u>1?'s':''}. Qui suis-je ?`,say:`J'ai ${t} dizaines et ${u} unités. Qui suis-je ?`,answer:String(n),choices:numChoices(n),explain:`${t} dizaines = ${10*t}, plus ${u} unités : <b>${n}</b>.`})}
      const t=R(1,8),u=R(0,9),s=t+u;return Q('logi',{text:`Je suis entre ${10*t} et ${10*t+9}. Mes deux chiffres font ${s} ensemble. Qui suis-je ?`,say:`Je suis entre ${10*t} et ${10*t+9}. Mes deux chiffres font ${s} ensemble. Qui suis-je ?`,answer:String(10*t+u),choices:numChoices(10*t+u),explain:`Le chiffre des dizaines est ${t}. Il faut ${t} + ${u} = ${s}, donc <b>${10*t+u}</b>.`});
    },
    biggest(){
      const max=d===1?10:d===2?20:99;const s=new Set();
      if(d>=3){const a=R(1,9),b=R(1,9);[10*a+b,10*b+a,10*a+a,10*b+b].forEach(x=>s.add(x))}
      while(s.size<4)s.add(R(1,max));
      const all=shuffle([...s]).slice(0,4);const small=d>=3&&Math.random()<.5;const ans=small?Math.min(...all):Math.max(...all);
      return Q('logi',{text:`Quel est le plus ${small?'petit':'grand'} nombre ?`,say:`Quel est le plus ${small?'petit':'grand'} nombre ?`,answer:String(ans),choices:all.map(String),explain:d>=3?`Compare d'abord les dizaines, puis les unités. Le plus ${small?'petit':'grand'} est <b>${ans}</b>.`:`Le plus ${small?'petit':'grand'} est <b>${ans}</b>.`});
    }
  };
  const pool=d<=1?['seq','pattern','intrus','biggest']:d<=2?['seq','pattern','intrus','biggest','riddle']:d<=4?['seq','pattern','intrus','balance','riddle','biggest']:d<=6?['seq','pattern','intrus','balance','riddle']:['seq','intrus','balance','riddle'];
  return types[pick(pool)]();
}
const GEN={calc:genCalc,prob:genProb,logi:genLogi};

    LEVELS.slice(k*4,k*4+4).forEach((lv,j)=>{
      const [x,y]=NODE_POS[j];const s=S.stars[lv.id]||0;const isCur=lv.id===cur&&!allDone;
      h+=`<button class="node${s?' done':''}${lv.cat==='mix'?' boss':''}${isCur?' current':''}" style="left:${x}%;top:${y}%" data-lvl="${lv.id}" ${lv.id>S.unlocked?'disabled':''} aria-label="Niveau ${lv.id+1}, ${CATS[lv.cat].n}">${lv.id+1}<span class="cat">${lv.id>S.unlocked?'🔒':CATS[lv.cat].i}</span>${s?`<span class="st">${[1,2,3].map(n=>STAR_SVG(n<=s)).join('')}</span>`:''}</button>`;
      if(isCur)h+=`<img class="isle-hero" src="${SPR.stand}" alt="" style="left:${x}%;top:${y}%">`;
    });
    if(locked)h+=`<div class="lock-note">Termine l'île précédente pour venir ici</div>`;
    else if(done&&!opened)h+=`<div class="lock-note" style="background:#cf8d12">Le coffre est prêt ! Touche-le pour l'ouvrir.</div>`;
    el.innerHTML=h+'</div>';row.appendChild(el);
  });
  // treasures strip
  $('treasures').innerHTML='<span>Mes trésors :</span>'+ISLANDS.map((I,k)=>S.chests.includes(k)?`<span class="t"><span>${I.treasure.e}</span>${I.treasure.n}</span>`:`<span class="t empty">❔ ${I.name}</span>`).join('');
  // scroll current island into view
  requestAnimationFrame(()=>{const isl=row.children[L.isl];if(isl){$('sea').scrollLeft=isl.offsetLeft-16}});
}
$('sea-row').addEventListener('click',e=>{
  const n=e.target.closest('[data-lvl]');if(n&&!n.disabled){SFX.click();startLevel(+n.dataset.lvl);return}
  const c=e.target.closest('[data-chest]');if(c){const k=+c.dataset.chest;
    if(S.chests.includes(k))toast(`Trésor trouvé : ${ISLANDS[k].treasure.n}`);
    else if(islandDone(k))openIslandChest(k);
    else toast('Réussis les 4 niveaux de l\'île pour ouvrir ce coffre.')}
});
$('btn-continue').onclick=()=>{SFX.click();const allDone=Object.keys(S.stars).length>=LEVELS.length;startLevel(allDone?R(0,19):currentLevel())};

function openIslandChest(k){
  S.chests.push(k);S.coins+=50;save();SFX.chest();renderStats();bump('coins');
  showOverlay(`<div class="end-scene"><img src="${SPR.victory}" alt=""><div class="big-chest">${chestSVG(false,'gc')}</div></div>
    <h2>Coffre de l'${ISLANDS[k].name} !</h2>
    <div class="treasure-won"><div class="e">${ISLANDS[k].treasure.e}</div><b>${ISLANDS[k].treasure.n}</b></div>
    <p><span class="reward"><span class="coin-i"></span>+50</span></p>
    <div class="row"><button class="go" data-act="map">Super !</button></div>`);
  setTimeout(()=>{const s=$('ov-card').querySelector('.big-chest svg');s&&s.classList.add('open')},350);
}

/* ================= OVERLAY ================= */
function showOverlay(html){$('ov-card').innerHTML=html;$('ov').hidden=false;const b=$('ov-card').querySelector('button');b&&b.focus()}
function hideOverlay(){$('ov').hidden=true}
$('ov').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;SFX.click();const a=b.dataset.act;hideOverlay();
  if(a==='map')show('map');else if(a==='next')startLevel(Math.min(run.lvl.id+1,LEVELS.length-1));else if(a==='again')startLevel(run.lvl.id);
  else if(a==='reset-yes'){const keep={sound:S.sound,voice:S.voice};S=Object.assign(fresh(),keep);save();renderParents();toast('Progression remise à zéro')}
});

/* ================= SCREENS ================= */
function show(name){
  ['map','play','parents'].forEach(n=>$('scr-'+n).hidden=n!==name);
  if(name==='map')renderMap();if(name==='parents')renderParents();
  try{speechSynthesis.cancel()}catch(e){}
}

/* ================= PLAY ================= */
let run=null;
function stageMetrics(){const st=$('stage');const W=st.clientWidth,H=st.clientHeight;const pw=clamp(Math.min(W*.3,H*.42),80,190);return {W,H,pw,sp:Math.max(pw*1.55,W*.42),hx:W*.22}}
function buildStage(){
  const m=stageMetrics();run.m=m;const st=$('stage');st.style.setProperty('--pw',m.pw+'px');
  const tr=$('track');let h='';
  for(let i=0;i<=run.lvl.goal;i++){
    const x=m.hx+i*m.sp;const last=i===run.lvl.goal;
    h+=`<div class="plat" style="left:${x}px">${(i%2===1&&!last)?`<div class="tree" style="--tx:${i%4===1?'58%':'4%'}">${TREE}</div>`:''}</div>`;
    if(i<run.lvl.goal)h+=`<div class="coin${i<run.correct?' got':''}" data-coin="${i}" style="left:${x+m.sp/2}px;bottom:calc(17% + ${m.pw*.42+m.pw*.75}px)"></div>`;
    if(last)h+=`<div class="chest-wrap" id="lvl-chest" style="left:${x+m.pw*.34}px;bottom:calc(17% + ${m.pw*.36}px)">${chestSVG(false,'gl')}</div>`;
  }
  tr.innerHTML=h;tr.style.transition='none';tr.style.transform=`translateX(${-run.correct*m.sp}px)`;void tr.offsetWidth;tr.style.transition='';
  // distant islands
  const far=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100"><path d="M0 100 Q60 55 120 70 T230 60 Q290 40 330 75 T400 70 V100 Z" fill="#9fdcd0"/><path d="M40 100 Q90 70 150 82 T260 78 T400 88 V100 Z" fill="#7cc7b6"/></svg>`;
  $('far').style.backgroundImage=`url("data:image/svg+xml,${encodeURIComponent(far)}")`;
  $('far').style.backgroundPositionX=`${-run.correct*m.sp*.25}px`;
  const hero=$('hero');hero.style.left=m.hx+'px';setPose('stand');
  $('progress').innerHTML=Array.from({length:run.lvl.goal},(_,i)=>`<i class="${i<run.correct?'on':''}"></i>`).join('');
  $('lvl-tag').textContent=`${ISLANDS[run.lvl.isl].name} · Niveau ${run.lvl.id+1}`;
}
function setPose(p){const h=$('hero');h.src=SPR[p];const base=run?run.m.pw*1.05:110;h.style.height=(POSE_H[p]/78*base)+'px'}
function startLevel(i){
  const lvl=LEVELS[i];
  run={lvl,correct:0,mistakes:0,streak:0,adj:0,earned:0,attempt:0,q:null,recent:[],busy:false};
  show('play');buildStage();nextQuestion();
}
function nextQuestion(){
  const lvl=run.lvl;const d=clamp(lvl.tier+run.adj,1,10);
  let q,tries=0;do{const cat=lvl.cat==='mix'?pick(['calc','prob','logi']):lvl.cat;q=GEN[cat](d);tries++}while(run.recent.includes(q.say)&&tries<8);
  run.recent=[q.say,...run.recent].slice(0,6);run.q=q;run.attempt=0;run.busy=false;
  const C=CATS[q.cat];const chip=$('q-chip');chip.className='chip '+q.cat;chip.textContent=`${C.i} ${C.n}`;
  $('q-body').innerHTML=`${q.text?`<p class="q-text">${q.text}</p>`:''}${q.vis||''}${q.big?`<p class="q-big">${q.big}</p>`:''}`;
  $('q-fb').innerHTML='';
  const A=$('answers');A.innerHTML='';
  q.choices.forEach(c=>{const b=document.createElement('button');b.className='ans';b.textContent=c;b.onclick=()=>answer(b,c);A.appendChild(b)});
  setPose('stand');
  if(S.voice)speak(q.say);
}
$('btn-listen').onclick=()=>run&&run.q&&speak(run.q.say);
function answer(btn,val){
  if(run.busy||btn.disabled)return;const q=run.q;const cat=q.cat;
  if(val===q.answer){
    run.busy=true;btn.classList.add('ok');[...$('answers').children].forEach(b=>b.disabled=true);
    if(run.attempt===0){S.stats[cat][0]++;S.stats[cat][1]++}
    const gain=run.attempt===0?5:2;run.streak++;run.earned+=gain;S.coins+=gain;
    if(run.streak>=2)run.adj=Math.min(1,run.adj+1);
    let msg=pick(['Bravo !','Super !','Excellent !','Bien joué !','Génial !']);
    if(run.streak>0&&run.streak%3===0){S.coins+=3;run.earned+=3;msg=`Série de ${run.streak} ! +3 bonus`}
    save();
    $('q-fb').innerHTML=`<div class="fb good">${msg} +${gain} pièces</div>`;
    advance();
  }else{
    btn.classList.add('no');btn.disabled=true;SFX.wrong();
    if(run.attempt===0){run.mistakes++;run.streak=0;run.adj=Math.max(-1,run.adj-1);S.stats[cat][1]++;save()}
    run.attempt++;setPose('duck');setTimeout(()=>run&&!run.busy&&setPose('crouch'),600);
    if(run.attempt===1){$('q-fb').innerHTML=`<div class="fb try">Presque ! Regarde bien et essaie encore.</div>`}
    else{
      run.busy=true;[...$('answers').children].forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('ok')});
      $('q-fb').innerHTML=`<div class="fb explain">${q.explain}<div><button class="go" id="btn-understood">J'ai compris</button></div></div>`;
      $('btn-understood').onclick=()=>{SFX.click();nextQuestion()};$('btn-understood').focus();
    }
  }
}
function advance(){
  const m=run.m;const idx=run.correct;run.correct++;
  const hero=$('hero');SFX.jump();setPose('jump');
  const tr=$('track');tr.style.transform=`translateX(${-run.correct*m.sp}px)`;
  $('far').style.backgroundPositionX=`${-run.correct*m.sp*.25}px`;
  hero.animate([{transform:'translateX(-50%) translateY(0)'},{transform:`translateX(-50%) translateY(${-m.pw*.95}px)`,offset:.45},{transform:'translateX(-50%) translateY(0)'}],{duration:900,easing:'ease-in-out'});
  setTimeout(()=>{const c=document.querySelector(`[data-coin="${idx}"]`);if(c){flyCoin(c);c.classList.add('got')}SFX.coin()},420);
  setTimeout(()=>{
    setPose('run');setTimeout(()=>setPose('stand'),250);
    const bars=$('progress').children;if(bars[idx])bars[idx].classList.add('on');
    renderStats();bump('coins');
    if(run.correct>=run.lvl.goal)setTimeout(finishLevel,450);else setTimeout(nextQuestion,550);
  },900);
}
function flyCoin(src){
  const a=src.getBoundingClientRect(),b=$('coins').getBoundingClientRect();
  const f=document.createElement('div');f.className='fly coin-i';f.style.left=a.left+'px';f.style.top=a.top+'px';document.body.appendChild(f);
  const an=f.animate([{transform:'translate(0,0) scale(1.2)'},{transform:`translate(${b.left-a.left}px,${b.top-a.top}px) scale(.8)`}],{duration:650,easing:'cubic-bezier(.5,0,.7,1)'});
  an.onfinish=()=>f.remove();
}
function finishLevel(){
  const lv=run.lvl;const stars=run.mistakes===0?3:run.mistakes<=2?2:1;
  const before=S.stars[lv.id]||0;S.stars[lv.id]=Math.max(before,stars);
  const bonus=stars*10;S.coins+=bonus;run.earned+=bonus;S.unlocked=Math.max(S.unlocked,lv.id+1);S.played++;save();
  setPose('victory');$('hero').style.left=(run.m.hx-run.m.pw*.12)+'px';const ch=$('lvl-chest');if(ch)ch.querySelector('svg').classList.add('open');SFX.chest();
  const islandNow=islandDone(lv.isl)&&!S.chests.includes(lv.isl);
  const last=lv.id===LEVELS.length-1;
  const titles=['Bien joué !','Très bien !','Parfait !'];
  setTimeout(()=>{
    showOverlay(`<div class="end-scene"><img src="${SPR.victory}" alt=""><div class="big-chest">${chestSVG(true,'ge')}</div></div>
      <h2>${titles[stars-1]}</h2>
      <div class="stars">${[1,2,3].map(n=>STAR_SVG(n<=stars)).join('')}</div>
      <p>${run.mistakes===0?'Aucune erreur, tu es un vrai explorateur !':`${run.mistakes} erreur${run.mistakes>1?'s':''}. ${stars<3?'Rejoue pour décrocher 3 étoiles.':''}`}</p>
      <p><span class="reward"><span class="coin-i"></span>+${run.earned} pièces</span></p>
      ${islandNow?`<p><b>Tu as fini l'${ISLANDS[lv.isl].name} !</b> Un grand coffre t'attend sur la carte.</p>`:''}
      <div class="row">${islandNow?'<button class="go" data-act="map">Ouvrir le grand coffre</button>':last?'<button class="go" data-act="map">Voir la carte</button>':'<button class="go" data-act="next">Niveau suivant</button>'}<button class="go alt" data-act="again">Rejouer</button>${islandNow||last?'':'<button class="go alt" data-act="map">Carte</button>'}</div>`);
  },900);
}
$('btn-quit').onclick=()=>{SFX.click();show('map')};
let rsz;window.addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(()=>{if(run&&!$('scr-play').hidden){buildStage();}},150)});

/* ================= PARENTS ================= */
function renderParents(){
  renderStats();
  const lv=Object.keys(S.stars).length;
  const catRows=['calc','prob','logi'].map(c=>{const [ok,tot]=S.stats[c];const p=tot?Math.round(ok/tot*100):0;
    return `<div class="stat-row"><span>${CATS[c].i} ${CATS[c].n}</span><span>${tot?p+' %':'—'}</span></div><div class="meter"><i style="width:${p}%"></i></div><div class="muted">${ok} réussies du premier coup sur ${tot}</div>`}).join('<div style="height:8px"></div>');
  $('pgrid').innerHTML=`
    <div class="pcard"><h3>Réussite par type de défi</h3>${catRows}</div>
    <div class="pcard"><h3>Progression</h3>
      <div class="stat-row"><span>Niveaux terminés</span><span>${lv} / 20</span></div>
      <div class="stat-row"><span>Étoiles</span><span>${totalStars()} / 60</span></div>
      <div class="stat-row"><span>Pièces</span><span>${S.coins}</span></div>
      <div class="stat-row"><span>Trésors</span><span>${S.chests.length} / 5</span></div>
      <p class="muted">La difficulté monte d'île en île : additions jusqu'à 10 au début, tables de multiplication et partages à la fin. Dans un niveau, elle s'ajuste aussi : un peu plus dur après 2 bonnes réponses, un peu plus facile après une erreur.</p></div>
    <div class="pcard"><h3>Réglages</h3>
      <label class="toggle" for="t-voice"><span>Lire chaque question à voix haute</span><input type="checkbox" id="t-voice" ${S.voice?'checked':''}></label>
      <label class="toggle" for="t-sound"><span>Sons du jeu</span><input type="checkbox" id="t-sound" ${S.sound?'checked':''}></label>
      <p class="muted">La progression est enregistrée sur cet appareil, dans ce navigateur. Rien n'est envoyé ailleurs.</p>
      <button class="danger" id="btn-reset">Recommencer depuis le début</button></div>`;
  $('t-voice').onchange=e=>{S.voice=e.target.checked;save()};
  $('t-sound').onchange=e=>{S.sound=e.target.checked;save();renderStats()};
  $('btn-reset').onclick=()=>showOverlay(`<h2>Tout recommencer ?</h2><p>Les pièces, les étoiles et les trésors seront effacés sur cet appareil.</p><div class="row"><button class="go alt" data-act="parents">Annuler</button><button class="go" data-act="reset-yes">Oui, effacer</button></div>`);
}
$('btn-parents').onclick=()=>{SFX.click();show('parents')};
$('btn-back').onclick=()=>{SFX.click();show('map')};
$('btn-sound').onclick=()=>{S.sound=!S.sound;save();renderStats();SFX.click()};

/* expose generators for testing */
window.__ST={GEN,LEVELS,get S(){return S}};
show('map');
})();
</script>
